  <!-- Tile 1: Add report -->
  <g transform="translate(10,10)">
    <rect fill="#E7EEE7" stroke="#C7D6C9" stroke-width="1.5" x="0" y="0" rx="14" ry="14" width="120" height="100"/>
    <g transform="translate(42,14) scale(1.5)" fill="#176a21">
      <path d="M19 1v3h3v2h-3v3h-2V6h-3V4h3V1h2zm-7.5 4c-.34 0-.67.04-1 .09v4.51A2.5 2.5 0 0 1 12 12.5a2.5 2.5 0 0 1-2.5-2.5 2.5 2.5 0 0 1 2.5-2.5V5.09c.33.04.66.08 1 .15A7.5 7.5 0 0 1 19 12.5c0 5.25-7 13-7 13S5 17.75 5 12.5A7.5 7.5 0 0 1 11.5 5z"/>
    </g>
    <text x="60" y="74" font-size="16" font-weight="600" fill="#1A2E1F" text-anchor="middle">Add report</text>
