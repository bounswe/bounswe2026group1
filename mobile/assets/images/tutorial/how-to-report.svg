    <g transform="translate(42,14) scale(1.5)" fill="#176a21">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 0 1 9.5 9 2.5 2.5 0 0 1 12 6.5 2.5 2.5 0 0 1 14.5 9 2.5 2.5 0 0 1 12 11.5z"/>
    </g>
    <text x="60" y="74" font-size="16" font-weight="600" fill="#1A2E1F" text-anchor="middle">Pick spot</text>
  </g>
  <path d="M300 50 L316 60 L300 70" fill="none" stroke="#6A8470" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

