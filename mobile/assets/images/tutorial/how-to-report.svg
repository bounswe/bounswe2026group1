<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" role="img"
     aria-label="Five-step report flow: Add report, Pick spot, Add media, Describe, Submit">
  <defs>
    <style>
      .tile-bg   { fill: #E7EEE7; }
      .tile-edge { fill: none; stroke: #C7D6C9; stroke-width: 1.5; }
      .icon      { fill: #176a21; }
      .chev      { fill: none; stroke: #6A8470; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .label     { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #1A2E1F; text-anchor: middle; }
    </style>
    <symbol id="i-add-location" viewBox="0 0 24 24">
      <path class="icon" d="M19 1v3h3v2h-3v3h-2V6h-3V4h3V1h2zm-7.5 4c-.34 0-.67.04-1 .09v4.51A2.5 2.5 0 0 1 12 12.5a2.5 2.5 0 0 1-2.5-2.5 2.5 2.5 0 0 1 2.5-2.5V5.09c.33.04.66.08 1 .15A7.5 7.5 0 0 1 19 12.5c0 5.25-7 13-7 13S5 17.75 5 12.5A7.5 7.5 0 0 1 11.5 5z"/>
    </symbol>
    <symbol id="i-place" viewBox="0 0 24 24">
      <path class="icon" d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 0 1 9.5 9 2.5 2.5 0 0 1 12 6.5 2.5 2.5 0 0 1 14.5 9 2.5 2.5 0 0 1 12 11.5z"/>
    </symbol>
    <symbol id="i-add-photo" viewBox="0 0 24 24">
      <path class="icon" d="M3 4V1h2v3h3v2H5v3H3V6H0V4h3zm3 6V7h3V4h7l1.83 2H21c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V10h3zm7 9c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-3.2-5c0 1.77 1.43 3.2 3.2 3.2s3.2-1.43 3.2-3.2-1.43-3.2-3.2-3.2-3.2 1.43-3.2 3.2z"/>
    </symbol>
    <symbol id="i-edit-note" viewBox="0 0 24 24">
      <path class="icon" d="M3 10h11v2H3v-2zm0-2h11V6H3v2zm0 8h7v-2H3v2zm15.01-3.13.71-.71c.39-.39 1.02-.39 1.41 0l.71.71c.39.39.39 1.02 0 1.41l-.71.71-2.12-2.12zm-.71.71-5.3 5.3V21h2.12l5.3-5.3-2.12-2.12z"/>
    </symbol>
    <symbol id="i-send" viewBox="0 0 24 24">
      <path class="icon" d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2 .01 7z"/>
    </symbol>
  </defs>

  <!-- Tile 1: Add report -->
  <g transform="translate(10,10)">
    <rect class="tile-bg"   x="0" y="0" rx="14" ry="14" width="120" height="100"/>
    <rect class="tile-edge" x="0" y="0" rx="14" ry="14" width="120" height="100"/>
    <use href="#i-add-location" x="42" y="14" width="36" height="36"/>
    <text class="label" x="60" y="74">Add report</text>
  </g>
  <!-- Chevron -->
  <path class="chev" d="M140 50 L156 60 L140 70"/>

  <!-- Tile 2: Pick spot -->
  <g transform="translate(170,10)">
    <rect class="tile-bg"   x="0" y="0" rx="14" ry="14" width="120" height="100"/>
    <rect class="tile-edge" x="0" y="0" rx="14" ry="14" width="120" height="100"/>
    <use href="#i-place" x="42" y="14" width="36" height="36"/>
    <text class="label" x="60" y="74">Pick spot</text>
  </g>
  <path class="chev" d="M300 50 L316 60 L300 70"/>

  <!-- Tile 3: Add media -->
  <g transform="translate(330,10)">
    <rect class="tile-bg"   x="0" y="0" rx="14" ry="14" width="120" height="100"/>
    <rect class="tile-edge" x="0" y="0" rx="14" ry="14" width="120" height="100"/>
    <use href="#i-add-photo" x="42" y="14" width="36" height="36"/>
    <text class="label" x="60" y="74">Add media</text>
  </g>
  <path class="chev" d="M460 50 L476 60 L460 70"/>

  <!-- Tile 4: Describe -->
  <g transform="translate(490,10)">
    <rect class="tile-bg"   x="0" y="0" rx="14" ry="14" width="120" height="100"/>
    <rect class="tile-edge" x="0" y="0" rx="14" ry="14" width="120" height="100"/>
    <use href="#i-edit-note" x="42" y="14" width="36" height="36"/>
    <text class="label" x="60" y="74">Describe</text>
  </g>
  <path class="chev" d="M620 50 L636 60 L620 70"/>

  <!-- Tile 5: Submit -->
  <g transform="translate(650,10)">
    <rect class="tile-bg"   x="0" y="0" rx="14" ry="14" width="100" height="100"/>
    <rect class="tile-edge" x="0" y="0" rx="14" ry="14" width="100" height="100"/>
    <use href="#i-send" x="32" y="14" width="36" height="36"/>
    <text class="label" x="50" y="74">Submit</text>
  </g>
</svg>
