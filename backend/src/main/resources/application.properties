spring.application.name=backend

# Empty default allows the app to start locally; routing calls need a real key (set ORS_API_KEY in .env).
ors.api.key=${ORS_API_KEY:}

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# Fail within ~10s if PostgreSQL is not running (longer waits often look like a "freeze" in the IDE).
spring.datasource.hikari.connection-timeout=10000

spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect

# Flyway runs before Hibernate. baseline-on-migrate lets it adopt existing
# databases (created previously by ddl-auto=update) by treating them as if
# already at V1, then applying V2 onwards. Hybrid mode: Hibernate still
# manages tables/columns from JPA entities; Flyway handles the tweaks
# Hibernate cannot express (constraint drops, manual ALTERs, etc.).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

app.api.key=${APP_API_KEY}

# --- File Upload Protection (t3.micro RAM Safety) ---
# Limits individual files to 15MB
spring.servlet.multipart.max-file-size=15MB
# Limits the total request (if they send multiple files at once) to 25MB
spring.servlet.multipart.max-request-size=25MB

# --- AWS S3 Configuration ---
aws.s3.bucket=${AWS_BUCKET_NAME}
aws.region=${AWS_REGION}
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}

spring.config.import=optional:file:.env[.properties], optional:file:./backend/.env[.properties]

springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/api-docs
server.forward-headers-strategy=framework
app.server.url=${APP_SERVER_URL:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:[*],https://localhost:[*],http://127.0.0.1:[*],https://127.0.0.1:[*],http://10.0.2.2:[*],http://192.168.*:[*]}

# The number of approvals required to change a report's status to VERIFIED
app.report.verification.threshold=5
# Min ratio of votes (in either direction) needed to flip a report's status.
app.report.verification.ratio=0.60

# Fix-request flow (issue #400)
# Number of agree votes required to transition a report to FIXED.
app.report.fix.threshold=5
# Minimum agree-ratio required (agrees / (agrees + disagrees)).
app.report.fix.ratio=0.60
# Days an OPEN fix request stays alive before being silently expired.
app.report.fix.window-days=7
# Days a FIXED report is retained before the cleanup job deletes it.
app.report.deletion.delay-days=7
