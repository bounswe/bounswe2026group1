spring.application.name=backend

# Empty default allows the app to start locally; routing calls need a real key (set ORS_API_KEY in .env).
ors.api.key=${ORS_API_KEY:}

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# Fail within ~10s if PostgreSQL is not running (longer waits often look like a "freeze" in the IDE).
spring.datasource.hikari.connection-timeout=10000

spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.sql.init.mode=always

spring.config.import=optional:file:.env[.properties], optional:file:./backend/.env[.properties]

springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/api-docs