spring.application.name=backend

# Empty default allows the app to start locally; routing calls need a real key (set ORS_API_KEY in .env).
ors.api.key=${ORS_API_KEY:}

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
# Fail within ~10s if PostgreSQL is not running (longer waits often look like a "freeze" in the IDE).
spring.datasource.hikari.connection-timeout=10000

spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- File Upload Protection (t3.micro RAM Safety) ---
# Limits individual files to 15MB
spring.servlet.multipart.max-file-size=15MB
# Limits the total request (if they send multiple files at once) to 25MB
spring.servlet.multipart.max-request-size=25MB

# --- AWS S3 Configuration ---
aws.s3.bucket=${AWS_BUCKET_NAME}
aws.region=${AWS_REGION}
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
spring.sql.init.mode=always

spring.config.import=optional:file:.env[.properties], optional:file:./backend/.env[.properties]

springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/api-docs

# The number of approvals required to change a report's status to VERIFIED
app.report.verification.threshold=5
