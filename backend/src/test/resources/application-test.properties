spring.application.name=backend-test

# Note: RouteServiceLiveOrsIntegrationTest is a live ORS test and runs only when ORS_API_KEY is set.
# OpenRouteService (full context tests); override with env ORS_API_KEY when needed
ors.api.key=${ORS_API_KEY:}

# In-memory DB for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway is disabled in tests: H2 (PostgreSQL mode) doesn't support every
# Postgres-specific construct used by the production migrations (e.g. PL/pgSQL
# DO blocks). ddl-auto=create-drop already builds the schema from JPA entities
# for tests, so migrations would only be re-validating shape — not worth the
# cross-dialect maintenance burden.
spring.flyway.enabled=false

# JPA behavior in tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Mock API KEY for testing (required by ApiKeyAuthFilter)
app.api.key=test-api-key

# Required by JwtUtil (@Value("${JWT_SECRET_KEY}"))
JWT_SECRET_KEY=01234567890123456789012345678901

# Disable data.sql seed script in tests (uses PostgreSQL-specific syntax)
spring.sql.init.mode=never

# AWS S3 (stub values so AwsConfig bean can be created in full-context tests)
aws.region=us-east-1
aws.access-key=test-access-key
aws.secret-key=test-secret-key
aws.s3.bucket=test-bucket