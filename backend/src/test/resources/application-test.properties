spring.application.name=backend-test

# OpenRouteService (full context tests); override with env ORS_API_KEY when needed
ors.api.key=${ORS_API_KEY:test-ors-key-placeholder}

# In-memory DB for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA behavior in tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Required by JwtUtil (@Value("${JWT_SECRET_KEY}"))
JWT_SECRET_KEY=01234567890123456789012345678901

# Disable data.sql seed script in tests (uses PostgreSQL-specific syntax)
spring.sql.init.mode=never

# AWS S3 (stub values so AwsConfig bean can be created in full-context tests)
aws.region=us-east-1
aws.access-key=test-access-key
aws.secret-key=test-secret-key
aws.s3.bucket=test-bucket